[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cloth2bones"
version = "0.1.0"
description = "Convert baked cloth geometry animation into clean skinned bones and body-driven cloth-rig baselines."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools]
packages = ["cloth2bones"]

[tool.ruff]
target-version = "py310"
line-length = 140
exclude = ["tools/blender-*", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["cloth2bones"]
exclude = ["**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
